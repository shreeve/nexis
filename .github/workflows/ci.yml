# nexis CI: the full gate on macOS and Linux, the codegen check of the
# fast dispatch handlers on macOS, the gate again with a collection
# every few kilobytes and every store commit synced, formatting and the
# parser check, and a speed-optimized build with a benchmark smoke run
# and the static (musl) Linux binaries.
#
# `zig build check-targets` is not a job. The test jobs build every
# binary natively on x86_64 and aarch64 Linux (glibc) and on macOS, and
# the release job links bin/nexis statically against musl for both
# architectures; check-targets would add only the musl test binaries,
# at the cost of compiling all 28 binaries for four targets.
#
# nexis builds against emdb as a path dependency (build.zig.zon
# `.path = "../emdb"`), so every job checks nexis out into `nexis/` and
# emdb into `emdb/` beside it. emdb is a private repository: the
# checkout reads it with the repository secret EMDB_TOKEN, a
# fine-grained personal access token whose only permission is
# "Contents: read-only" on shreeve/emdb. Secrets do not reach pull
# requests from forks, so those runs fail at the emdb checkout.
#
# mlugg/setup-zig installs Zig and caches the Zig cache directory (the
# global cache, with the local caches redirected into it) under a key
# of the job, the Zig release and host, and the hash of build.zig.zon.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          path: nexis
      - uses: actions/checkout@v6
        with:
          repository: shreeve/emdb
          token: ${{ secrets.EMDB_TOKEN }}
          path: emdb
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ hashFiles('nexis/build.zig.zon') }}
      - name: zig build test
        working-directory: nexis
        run: zig build test --summary all
      # The codegen check (docs/VM.md §8) disassembles the arm64 and
      # x86-64 Linux release builds with an LLVM objdump: the macOS
      # runner's, from Xcode's tools.
      - name: zig build codegen
        if: runner.os == 'macOS'
        working-directory: nexis
        run: zig build codegen --summary all

  # The gate under the collector's stress policy (docs/GC.md §7), where
  # a native that keeps a value unrooted across an allocation fails, and
  # with every commit synced (docs/DB.md §3.3), the durability the
  # plain gate never takes. The two settings are independent, so one
  # run covers both.
  stress:
    name: test (gc-stress, durable)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          path: nexis
      - uses: actions/checkout@v6
        with:
          repository: shreeve/emdb
          token: ${{ secrets.EMDB_TOKEN }}
          path: emdb
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ hashFiles('nexis/build.zig.zon') }}
      - name: zig build test -Dgc-stress -Ddurability=durable
        working-directory: nexis
        run: zig build test -Dgc-stress -Ddurability=durable --summary all

  lint:
    name: fmt and parser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: nexis
      - uses: actions/checkout@v6
        with:
          repository: shreeve/emdb
          token: ${{ secrets.EMDB_TOKEN }}
          path: emdb
      # The parser generator; public. `parser-check` diffs its output
      # against the committed src/parser.zig.
      - uses: actions/checkout@v6
        with:
          repository: shreeve/nexus
          path: nexus
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ hashFiles('nexis/build.zig.zon') }}
      - name: zig fmt --check (src/parser.zig is generated)
        working-directory: nexis
        run: git ls-files -z '*.zig' '*.zig.zon' ':!:src/parser.zig' | xargs -0 zig fmt --check
      - name: build nexus
        working-directory: nexus
        run: zig build
      - name: zig build parser-check
        working-directory: nexis
        run: zig build parser-check --summary all

  release:
    name: optimized, bench and static binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: nexis
      - uses: actions/checkout@v6
        with:
          repository: shreeve/emdb
          token: ${{ secrets.EMDB_TOKEN }}
          path: emdb
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ hashFiles('nexis/build.zig.zon') }}
      - name: optimized bin/nexis
        working-directory: nexis
        run: |
          zig build install -Doptimize=fast
          test "$(./bin/nexis -e '(reduce + (range 101))')" = 5050
          ./bin/nexis run examples/shapes-app.nx
      - name: benchmark smoke run
        working-directory: nexis
        run: zig build bench -Doptimize=fast
      # x86-64-v2 (SSE4.2, POPCNT): the CPU level the shipped binary
      # asks for, Intel Nehalem and AMD Bulldozer or later.
      - name: static x86_64-linux-musl bin/nexis (x86-64-v2)
        working-directory: nexis
        run: |
          zig build install -Doptimize=fast -Dtarget=x86_64-linux-musl -Dcpu=x86_64_v2
          file bin/nexis | tee /dev/stderr | grep -q 'statically linked'
          test "$(./bin/nexis -e '(reduce + (range 101))')" = 5050
      # Built, not run: this job runs on x86_64.
      - name: static aarch64-linux-musl nexis
        working-directory: nexis
        run: |
          zig build install -Doptimize=fast -Dtarget=aarch64-linux-musl --prefix "$RUNNER_TEMP/aarch64"
          file "$RUNNER_TEMP/aarch64/bin/nexis" | tee /dev/stderr | grep -q 'statically linked'
